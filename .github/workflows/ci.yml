name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values so createApp() can boot under test; stub-mode tests set
      # RAG_FEEDER_STUB themselves.
      RAG_FEEDER_JWT_SECRET: ci-test-secret
      RAG_ADMIN_USER: ci-admin
      RAG_ADMIN_PASSWORD: ci-password
      RAG_FEEDER_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install requests
      - run: npm test

  frontend:
    name: Frontend build + mocked e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      # Mock-only specs (no live backend needed). Live/real specs are opt-in via
      # their own env flags and are intentionally excluded here.
      - run: npx playwright test tests/graph-3d.spec.ts tests/seed-upload.spec.ts tests/boot-requests.spec.ts tests/search-scale.spec.ts tests/topic-search.spec.ts tests/table-columns.spec.ts --workers=2

  python-search:
    name: Python search and schema tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dl_lit_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest requests python-dotenv rapidfuzz 'bibtexparser>=2.0.0b8'
      - run: python -m pytest tests/test_keyword_search.py tests/test_keyword_search_script.py tests/test_openalex_quota.py tests/test_openalex_ref_counts.py tests/test_search_run_status.py tests/test_corpus_list_sort.py -q
